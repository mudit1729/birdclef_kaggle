[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "birdclef2026"
version = "0.1.0"
description = "Local BirdCLEF 2026 training and submission pipeline."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "kaggle>=1.7.4.5",
  "librosa>=0.10.2.post1",
  "numpy>=1.26,<2.1",
  "pandas>=2.2",
  "PyYAML>=6.0.2",
  "scikit-learn>=1.6",
  "soundfile>=0.13",
  "timm>=1.0.19",
  "torch==2.6.0",
  "torchvision==0.21.0",
  "tqdm>=4.67",
  "transformers>=5.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[project.scripts]
birdclef-download = "birdclef2026.cli:download_main"
birdclef-infer = "birdclef2026.cli:infer_main"
birdclef-pull-baseline = "birdclef2026.cli:pull_baseline_main"
birdclef-submit = "birdclef2026.cli:submit_main"
birdclef-submit-code = "birdclef2026.cli:submit_code_main"
birdclef-submit-kernel = "birdclef2026.cli:submit_kernel_main"
birdclef-train = "birdclef2026.cli:train_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = ["external", "kaggle/birdclef_2026_gpu/run.py", "src/birdclef2026/beats_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
